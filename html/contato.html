<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/contato.css">
    <title>Contato</title>
</head>
<body>
    <header>
        <img src="/img/ford-96.png" alt="Logo Ford">
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="lançamento.html">Lançamento</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
        <div></div>
      </header>
    <main class="contatoPagina">
        <div class="contato-imagem">
            <img src="/img/xls 2.2 diesel.jpg" alt="Veiculo Contato">
        </div>
        <section class="formularioContainer">
            <form class="formulario">
                <h3>Sobre Você</h3>
                <div class="inputGrupo">
                    <input type="text" placeholder="Nome Completo">

                </div>
                <div class="inputGrupo">
                   <input type="email" placeholder="E-mail">
                </div>
                <div class="inputGrupo">
                    <input type="tel" placeholder="Telefone">
                </div>
                <div class="inputGrupo">
                    <select>
                        <option value="" disabled selected hidden>Tipoe De Contato</option>
                        <option value="elogio">Elogio</option>
                        <option value="reclamacao">Reclamação</option>
                        <option value="solicitacao">Solicitação</option>
                    </select>
                </div>
                <div class="inputGrupo">
                     <textarea placeholder="Digite Sua Mensagem" rows="2"></textarea>
                </div>
                <button type="submit" class="submitBotao">
                    <span>Enviar Mensagem</span>
                </button>
            </form>
        </section>
    </main>
    <footer>
        <div class="RedesSociais">
          <p>RedesSociais</p>
        <a href="#"><img src="/img/facebook-50.png" alt="Facebook"></a>
        <a href="#"><img src="/img/instagram-logo-50.png" alt="Instagram"></a>
        <a href="#"><img src="/img/youtube-squared-50.png" alt="Youtube"></a>
       </div>
       <div class="copyright">
        <p>&copy; 2025 Ford Motor Company Todos Os Direitos Reservados</p>
       </div>
       <div class="logo_footer">
        <img src="/img/ford-96.png" alt="Logo Ford">
      </div>
      </footer>
</body>
</html>
